<!DOCTYPE html>
<html lang="en">
  <head>

    <title>Redirecting…</title>

      const spawn = new URLSearchParams(location.search).get("spawn") || "experience";
      location.replace("index.html?spawn=" + encodeURIComponent(spawn));

</html>
