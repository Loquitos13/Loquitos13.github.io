<!DOCTYPE html>
<html lang="en-US" class="world-root">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Explore Diogo Pinto's portfolio in a playable 3D world." />
    <title>Diogo Pinto · 3D Portfolio</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/theme.css" rel="stylesheet" />
    <link href="css/world.css" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body class="world-app">
    <canvas id="worldCanvas" aria-label="3D portfolio world"></canvas>

    <div class="world-ui">
      <div class="world-top">
        <div class="world-brand">
          <strong id="worldBrandTitle">Diogo Pinto Portfolio</strong>
          <span id="worldBrandSub">3D exploration</span>
        </div>
        <div class="world-controls">
          <div class="lang-switch" data-lang-toggle role="group" aria-label="Language">
            <button type="button" data-lang="pt" aria-pressed="false">PT</button>
            <button type="button" data-lang="en" aria-pressed="true">EN</button>
          </div>
          <a href="admin.html">Admin</a>
          <a href="mailto:bdiogo511@gmail.com">Email</a>
        </div>
      </div>

      <div id="worldHint" class="world-hint">WASD · E interact · Esc release mouse</div>

      <div id="worldStart" class="world-start">
        <div class="world-start-card">
          <h1 id="worldStartTitle">Enter the portfolio</h1>
          <p id="worldStartText">Move with WASD. Look with the mouse. Walk to terminals and press E.</p>
          <button type="button" id="worldStartBtn">Start exploring</button>
        </div>
      </div>

      <div id="worldPanel" class="world-panel" hidden>
        <div class="world-panel__head">
          <h2 id="worldPanelTitle">Panel</h2>
          <button type="button" id="worldPanelClose" class="world-panel__close" aria-label="Close">×</button>
        </div>
        <div id="worldPanelBody"></div>
      </div>

      <div id="worldTouch" class="world-touch"><div id="worldTouchKnob" class="world-touch-knob"></div></div>
      <button type="button" id="worldTouchAction" class="world-touch-action">E</button>
    </div>

    <div id="cvPdfTemplate" style="display:none">
      <div class="cv-a4">
        <div class="cv-grid">
          <aside class="cv-left"><div class="cv-left-inner">
            <h1 class="cv-name">Diogo Pinto</h1>
            <h2 class="cv-role">Web Developer</h2>
          </div></aside>
          <section class="cv-right">
            <div class="cv-section"><div class="cv-cards" id="cvPdfExperienceCards"></div></div>
            <div class="cv-section"><div class="cv-cards" id="cvPdfInternshipCards"></div></div>
            <div class="cv-section"><div class="cv-cards" id="cvPdfEducationCards"></div></div>
          </section>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="js/portfolio-data.js"></script>
    <script src="js/scripts.js"></script>
    <script type="module" src="js/world3d.js"></script>
  </body>
</html>
