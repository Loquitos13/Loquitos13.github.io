<!DOCTYPE html>
<html lang="en-US" class="story-html">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Diogo Pinto — a career told as a timeline." />
    <title>Diogo Pinto · Journey</title>
    <link rel="icon" type="image/x-icon" href="assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=Plus+Jakarta+Sans:wght@400;600;700&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet" />
    <link href="css/styles.css" rel="stylesheet" />
    <link href="css/story.css" rel="stylesheet" />
  </head>
  <body class="story-app">
    <div class="journey-thread" aria-hidden="true"><span id="journeyThread"></span></div>
    <div class="story-progress" aria-hidden="true"><span id="storyProgress"></span></div>
    <header class="story-top">
      <div class="story-top__inner">
        <a class="story-brand" href="#scene-0">
          <strong>Diogo Pinto</strong>
          <span id="storyBrandSub">The line</span>
        </a>
        <span id="storyCount" class="story-count">Chapter 01</span>
        <div class="story-actions">
          <div data-lang-toggle role="group" aria-label="Language">
            <button type="button" data-lang="pt" aria-pressed="false">PT</button>
            <button type="button" data-lang="en" aria-pressed="true">EN</button>
          </div>
          <button type="button" id="storyPdf">CV</button>
        </div>
      </div>
    </header>
    <nav id="storyRail" class="story-rail" aria-label="Timeline"></nav>
    <main id="storyScroll" class="story-scroll"></main>
    <div id="cvPdfTemplate" style="display:none">
      <div class="cv-a4">
        <div class="cv-grid">
          <aside class="cv-left"><div class="cv-left-inner">
            <h1 class="cv-name">Diogo Pinto</h1>
            <h2 class="cv-role">Web Developer</h2>
          </div></aside>
          <section class="cv-right">
            <div class="cv-section"><div class="cv-cards" id="cvPdfExperienceCards"></div></div>
            <div class="cv-section"><div class="cv-cards" id="cvPdfInternshipCards"></div></div>
            <div class="cv-section"><div class="cv-cards" id="cvPdfEducationCards"></div></div>
          </section>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="js/portfolio-data.js"></script>
    <script src="js/scripts.js"></script>
    <script src="js/story.js"></script>
  </body>
</html>
