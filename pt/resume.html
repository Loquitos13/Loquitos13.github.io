<!DOCTYPE html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <title>A redirecionar…</title>
    <script>
      const params = new URLSearchParams(location.search);
      const spawn = params.get("spawn") || "experience";
      const zone =
        spawn === "contact"
          ? "comms"
          : spawn === "projects"
            ? "field"
            : spawn === "education"
              ? "archive"
              : spawn === "experience" || spawn === "resume"
                ? "ops"
                : "hub";
      location.replace("index.html?zone=" + encodeURIComponent(zone));
    </script>
  </head>
  <body></body>
</html>
