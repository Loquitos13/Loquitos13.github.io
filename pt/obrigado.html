<!DOCTYPE html>
<html lang="pt-PT">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Mensagem recebida · Diogo Pinto</title>
    <meta name="robots" content="noindex, nofollow" />
    <meta name="theme-color" content="#16181d" />
    <link rel="icon" href="../assets/brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="../assets/favicon.ico" sizes="any" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&amp;family=IBM+Plex+Sans:wght@400;500;600&amp;display=swap" rel="stylesheet" />
    <link href="../css/site.css" rel="stylesheet" />
  </head>
  <body class="thanks-page">
    <div class="thanks-backdrop" data-thanks-close aria-hidden="true">
      <svg class="thanks-backdrop__mark" viewBox="0 0 256 256"><use href="../assets/brand/icons.svg#dp"></use></svg>
    </div>
    <main class="thanks" role="dialog" aria-modal="true" aria-labelledby="thanks-title" aria-describedby="thanks-text">
      <button type="button" class="thanks__close" data-thanks-close aria-label="Fechar e voltar">
        <svg class="icon" aria-hidden="true"><use href="../assets/brand/icons.svg#plus"></use></svg>
      </button>
      <span class="thanks__icon" aria-hidden="true">
        <svg class="icon"><use href="../assets/brand/icons.svg#check"></use></svg>
      </span>
      <p class="thanks__hello mono" id="thanks-hello">Obrigado!</p>
      <h1 id="thanks-title">Mensagem recebida</h1>
      <p id="thanks-text">Já tenho a sua mensagem. Respondo para o email que indicou o mais depressa possível, normalmente com perguntas concretas e um próximo passo.</p>
      <div class="thanks__actions">
        <a class="btn btn--green" href="contact.html" data-thanks-close>
          <svg class="icon thanks__back-icon" aria-hidden="true"><use href="../assets/brand/icons.svg#arrow"></use></svg>
          Voltar
        </a>
        <a class="btn btn--line" href="https://wa.me/351913417390?text=Ol%C3%A1%20Diogo%21%20Acabei%20de%20enviar%20uma%20mensagem%20pelo%20site." target="_blank" rel="noopener">
          <svg class="icon" aria-hidden="true"><use href="../assets/brand/icons.svg#wa"></use></svg>
          Falar já no WhatsApp
        </a>
      </div>
      <p class="thanks__more">Enquanto espera, veja os <a href="projects.html">projetos</a>.</p>
    </main>
    <script src="../js/thanks.js"></script>
  </body>
</html>
