<!DOCTYPE html>
<html lang="pt-PT" class="world-root">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Explora o portfólio de Diogo Pinto num mundo 3D jogável." />
    <title>Diogo Pinto · Portfólio 3D</title>
    <link rel="icon" type="image/x-icon" href="../assets/favicon.ico" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;600&amp;family=Plus+Jakarta+Sans:wght@400;600;700;800&amp;family=Syne:wght@700;800&amp;display=swap" rel="stylesheet" />
    <link href="../css/styles.css" rel="stylesheet" />
    <link href="../css/theme.css" rel="stylesheet" />
    <link href="../css/world.css" rel="stylesheet" />
    <script type="importmap">
      {
        "imports": {
          "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js"
        }
      }
    </script>
  </head>
  <body class="world-app">
    <canvas id="worldCanvas" aria-label="Mundo 3D do portfólio"></canvas>

    <div class="world-ui">
      <div class="world-top">
        <div class="world-brand">
          <strong id="worldBrandTitle">Portfólio Diogo Pinto</strong>
          <span id="worldBrandSub">Exploração 3D</span>
        </div>
        <div class="world-controls">
          <div class="lang-switch" data-lang-toggle role="group" aria-label="Idioma">
            <button type="button" data-lang="pt" aria-pressed="true">PT</button>
            <button type="button" data-lang="en" aria-pressed="false">EN</button>
          </div>
          <a href="../admin.html">Admin</a>
          <a href="mailto:bdiogo511@gmail.com">Email</a>
        </div>
      </div>

      <div id="worldHint" class="world-hint">WASD · E interagir · Esc libertar rato</div>

      <div id="worldStart" class="world-start">
        <div class="world-start-card">
          <h1 id="worldStartTitle">Entra no portfólio</h1>
          <p id="worldStartText">Move-te com WASD. Olha com o rato. Aproxima-te dos terminais e prime E.</p>
          <button type="button" id="worldStartBtn">Começar exploração</button>
        </div>
      </div>

      <div id="worldPanel" class="world-panel" hidden>
        <div class="world-panel__head">
          <h2 id="worldPanelTitle">Painel</h2>
          <button type="button" id="worldPanelClose" class="world-panel__close" aria-label="Fechar">×</button>
        </div>
        <div id="worldPanelBody"></div>
      </div>

      <div id="worldTouch" class="world-touch"><div id="worldTouchKnob" class="world-touch-knob"></div></div>
      <button type="button" id="worldTouchAction" class="world-touch-action">E</button>
    </div>

    <div id="cvPdfTemplate" style="display:none">
      <div class="cv-a4">
        <div class="cv-grid">
          <aside class="cv-left"><div class="cv-left-inner">
            <h1 class="cv-name">Diogo Pinto</h1>
            <h2 class="cv-role">Desenvolvedor Web</h2>
          </div></aside>
          <section class="cv-right">
            <div class="cv-section"><div class="cv-cards" id="cvPdfExperienceCards"></div></div>
            <div class="cv-section"><div class="cv-cards" id="cvPdfInternshipCards"></div></div>
            <div class="cv-section"><div class="cv-cards" id="cvPdfEducationCards"></div></div>
          </section>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/html2pdf.js@0.10.1/dist/html2pdf.bundle.min.js"></script>
    <script src="../js/portfolio-data.js"></script>
    <script src="../js/scripts.js"></script>
    <script type="module" src="../js/world3d.js"></script>
  </body>
</html>
